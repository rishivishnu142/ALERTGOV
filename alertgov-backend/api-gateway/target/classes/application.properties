server.port=8081
spring.application.name=api-gateway

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# Simple Global CORS Configuration for Gateway
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*

# Define routes for upcoming microservices (Auth and User as examples)
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**

spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=lb://user-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/users/**

spring.cloud.gateway.routes[2].id=incident-service
spring.cloud.gateway.routes[2].uri=lb://incident-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/incidents/**

spring.cloud.gateway.routes[3].id=alert-service
spring.cloud.gateway.routes[3].uri=lb://alert-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/alerts/**

spring.cloud.gateway.routes[4].id=approval-service
spring.cloud.gateway.routes[4].uri=lb://approval-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/approvals/**

spring.cloud.gateway.routes[5].id=notification-service
spring.cloud.gateway.routes[5].uri=lb://notification-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/v1/notifications/**

spring.cloud.gateway.routes[6].id=analytics-service
spring.cloud.gateway.routes[6].uri=lb://analytics-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/v1/analytics/**

spring.cloud.gateway.routes[7].id=ai-service
spring.cloud.gateway.routes[7].uri=lb://ai-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/v1/ai/**

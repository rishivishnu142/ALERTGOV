server:
  port: 8081
  error:
    include-message: always

spring:
  application:
    name: alertgov-backend

  # Oracle 11g Configuration
  datasource:
    url: jdbc:oracle:thin:@localhost:1521:XE
    username: system
    password: admin
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000

  # Spring Data JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  # MongoDB Configuration (for Images)
  data:
    mongodb:
      uri: mongodb+srv://rv75749d_db_user:HF5FRKjlhllLYGcF@cluster0.7efvpxm.mongodb.net/?appName=Cluster0&tls=true&tlsAllowInvalidCertificates=true
      database: alertgov_media

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
